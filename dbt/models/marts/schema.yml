version: 2

models:
  - name: dim_users
    description: User dimension table for analytics.
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: fct_orders
    description: Orders fact table for analytics and BI.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'pending']
      - name: amount
        tests:
          - not_null
