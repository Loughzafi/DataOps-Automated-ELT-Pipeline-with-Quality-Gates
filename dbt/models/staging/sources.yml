version: 2

sources:
  - name: raw_data
    schema: raw_data
    tables:
      - name: users_raw
        description: Raw users data generated by local seed script.
        columns:
          - name: user_id
            tests:
              - not_null
              - unique
          - name: email
            tests:
              - not_null
      - name: orders_raw
        description: Raw orders data generated by local seed script.
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: order_id
            tests:
              - not_null
              - unique
          - name: user_id
            tests:
              - not_null
          - name: order_status
            tests:
              - accepted_values:
                  values: ['completed', 'cancelled', 'pending']
